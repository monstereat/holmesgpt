name: develop-me AIOps checks
on:
  push:
    branches: [develop-me]
    paths:
      - 'holmes/plugins/toolsets/openobserve/**'
      - 'holmes/plugins/toolsets/__init__.py'
      - 'tests/plugins/toolsets/openobserve/**'
      - 'tests/toolsets/test_openobserve_toolset.py'
      - 'examples/openobserve-aiops/alert-trigger/**'
      - 'examples/openobserve-aiops/openobserve-proxy/**'
      - 'examples/openobserve-aiops/docker-compose.yaml'
      - 'examples/openobserve-aiops/otel-collector-production.yaml'
      - 'examples/openobserve-aiops/verify-production-otel-config.sh'
      - 'examples/openobserve-aiops/monitoring/**'
      - 'examples/openobserve-aiops/verify-aiops-alerts.sh'
      - 'examples/openobserve-aiops/backup-postgres.sh'
      - 'examples/openobserve-aiops/encrypt-postgres-backup.sh'
      - 'examples/openobserve-aiops/verify-postgresql-backup.sh'
      - 'examples/openobserve-aiops/postgresql-roles.psql'
      - 'examples/openobserve-aiops/postgresql-local-role-passwords.psql'
      - 'examples/openobserve-aiops/bootstrap-postgresql-roles.sh'
      - 'examples/openobserve-aiops/verify-postgresql-roles.sh'
      - 'examples/openobserve-aiops/POSTGRESQL-OPERATIONS.md'
      - '.github/workflows/develop-me-aiops.yml'
  workflow_dispatch:
jobs:
  openobserve-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install 'poetry==1.8.5'
      - name: Install HolmesGPT dependencies
        run: poetry install --with dev --no-interaction
      - name: Run mocked OpenObserve tests
        run: poetry run pytest -q --no-cov tests/plugins/toolsets/openobserve tests/toolsets/test_openobserve_toolset.py
      - name: Generate ephemeral local Compose credentials
        run: |
          for key in POSTGRES_PASSWORD ZO_ROOT_USER_PASSWORD OPENOBSERVE_PROXY_PASSWORD HOLMES_API_KEY ORDER_ACTION_TOKEN ALERT_WEBHOOK_TOKEN SESSION_SIGNING_KEY; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s=%s\n' "$key" "$value" >> "$GITHUB_ENV"
          done
          printf '%s\n' 'ZO_ROOT_USER_EMAIL=aiops-ci@example.test' 'OPENOBSERVE_PROXY_USERNAME=aiops-ci-proxy' 'AIOPS_TEST_USERS_JSON=[]' >> "$GITHUB_ENV"
      - name: Verify local Redis durable-write health check
        working-directory: examples/openobserve-aiops
        run: |
          docker compose up -d redis
          for attempt in $(seq 1 30); do
            if docker compose exec -T redis sh -c 'redis-cli ping | grep -q PONG && redis-cli --raw INFO persistence | grep -q "^aof_last_write_status:ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs --tail=30 redis
          exit 1
      - name: Build isolated OpenObserve policy proxy test image
        working-directory: examples/openobserve-aiops
        run: docker build --tag aiops-openobserve-proxy-test:ci ./openobserve-proxy
      - name: Run OpenObserve policy proxy unit tests without network access
        run: docker run --rm --network none aiops-openobserve-proxy-test:ci python -m unittest discover -s tests -v
      - name: Run isolated Incident API and workbench regression suite
        working-directory: examples/openobserve-aiops
        run: docker compose --profile test run --build --rm incident-test
      - name: Validate production OpenTelemetry Collector template
        run: bash examples/openobserve-aiops/verify-production-otel-config.sh
      - name: Validate AIOps Prometheus alert rules
        run: bash examples/openobserve-aiops/verify-aiops-alerts.sh
      - name: Verify encrypted PostgreSQL backup and isolated restore
        run: bash examples/openobserve-aiops/verify-postgresql-backup.sh
      - name: Verify PostgreSQL role separation and runtime grants
        run: bash examples/openobserve-aiops/verify-postgresql-roles.sh
