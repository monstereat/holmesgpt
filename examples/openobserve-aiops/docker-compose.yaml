name: holmesgpt-aiops-goal

x-postgresql-access-setup: &postgresql-access-setup
  image: postgres:16.6-alpine
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m
  entrypoint: ["/bin/sh", "-ec"]
  command:
    - |
      /bin/sh /bootstrap/bootstrap-postgresql-roles.sh
      export PGPASSWORD="$$POSTGRES_ADMIN_PASSWORD"
      psql --host postgres --port 5432 --username aiops --dbname aiops \
        --set ON_ERROR_STOP=1 <<'SQL'
      DO $$$$
      DECLARE item RECORD;
      BEGIN
          FOR item IN
              SELECT relation.relname, relation.relkind
              FROM pg_class AS relation
            JOIN pg_namespace AS namespace ON namespace.oid = relation.relnamespace
            WHERE namespace.nspname = 'public'
              AND relation.relkind IN ('r', 'p', 'S', 'v', 'm', 'f')
              AND (
                  relation.relkind <> 'S'
                  OR NOT EXISTS (
                      SELECT 1
                      FROM pg_depend AS dependency
                      WHERE dependency.classid = 'pg_class'::regclass
                        AND dependency.objid = relation.oid
                        AND dependency.deptype IN ('a', 'i')
                  )
              )
          LOOP
              CASE item.relkind
                  WHEN 'S' THEN EXECUTE format('ALTER SEQUENCE public.%I OWNER TO aiops_migrator', item.relname);
                  WHEN 'v' THEN EXECUTE format('ALTER VIEW public.%I OWNER TO aiops_migrator', item.relname);
                  WHEN 'm' THEN EXECUTE format('ALTER MATERIALIZED VIEW public.%I OWNER TO aiops_migrator', item.relname);
                  WHEN 'f' THEN EXECUTE format('ALTER FOREIGN TABLE public.%I OWNER TO aiops_migrator', item.relname);
                  ELSE EXECUTE format('ALTER TABLE public.%I OWNER TO aiops_migrator', item.relname);
              END CASE;
          END LOOP;
          ALTER SCHEMA public OWNER TO aiops_migrator;
      END
      $$$$;
      SQL
  environment:
    POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD before starting the local demo}
    AIOPS_DB_RUNTIME_PASSWORD: ${AIOPS_DB_RUNTIME_PASSWORD:?Export AIOPS_DB_RUNTIME_PASSWORD before starting the local demo}
    AIOPS_DB_MIGRATOR_PASSWORD: ${AIOPS_DB_MIGRATOR_PASSWORD:?Export AIOPS_DB_MIGRATOR_PASSWORD before starting the local demo}
    AIOPS_DB_WORKER_PASSWORD: ${AIOPS_DB_WORKER_PASSWORD:?Export AIOPS_DB_WORKER_PASSWORD before starting the local demo}
  volumes:
    - ./bootstrap-postgresql-roles.sh:/bootstrap/bootstrap-postgresql-roles.sh:ro
    - ./postgresql-roles.psql:/bootstrap/postgresql-roles.psql:ro
    - ./postgresql-local-role-passwords.psql:/bootstrap/postgresql-local-role-passwords.psql:ro
  networks:
    - app

services:
  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.3
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-demo@example.test}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Export ZO_ROOT_USER_PASSWORD before starting the local demo}
      ZO_DATA_DIR: /data
      ZO_HTTP_PORT: "5080"
      # Local synthetic evaluation cases span more than the default five-hour ingest window.
      # Keep this override confined to the test-only Docker demo.
      ZO_INGEST_ALLOWED_UPTO: "24"
      # Required only for this local demo's private Docker-network webhook.
      # Never enable this setting in production.
      ZO_SKIP_SSRF_CHECKS: "true"
      # This OSS test instance has no native RBAC; Holmes reaches it only through
      # openobserve-proxy on a network that the Holmes container cannot join.
    ports:
      - "127.0.0.1:5080:5080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - oo-data:/data
    networks:
      - observe-ui
      - telemetry-write
      - observe-policy
      - incident-webhook

  openobserve-proxy:
    build: ./openobserve-proxy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AIOPS_ENV: local
      OPENOBSERVE_PROXY_USERNAME: ${OPENOBSERVE_PROXY_USERNAME:?Export local proxy username before starting the demo}
      OPENOBSERVE_PROXY_PASSWORD: ${OPENOBSERVE_PROXY_PASSWORD:?Export local proxy password before starting the demo}
      OPENOBSERVE_UPSTREAM_URL: http://openobserve:5080
      OPENOBSERVE_ORG: default
      OPENOBSERVE_ALLOWED_FIELDS_JSON: >-
        {"app_logs":["_timestamp","timestamp","trace_id","span_id","service","service_name","level","message","route","release","event_type","commit_sha","changed_files","deployed_at","evaluation_run_id","evaluation_case_id","evaluation_source","alert_name"],"frontend_errors":["_timestamp","trace_id","span_id","service","release","message","stack","route"]}
      OPENOBSERVE_UPSTREAM_USERNAME: ${ZO_ROOT_USER_EMAIL:-demo@example.test}
      OPENOBSERVE_UPSTREAM_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Export ZO_ROOT_USER_PASSWORD before starting the local demo}
    networks:
      - observe-policy
      - holmes-observe
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD before starting the local demo}
    volumes:
      - aiops-postgres-data:/var/lib/postgresql/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops"]
      interval: 5s
      timeout: 3s
      retries: 20

  incident-db-bootstrap:
    <<: *postgresql-access-setup
    depends_on:
      postgres:
        condition: service_healthy

  incident-db-finalize:
    <<: *postgresql-access-setup
    depends_on:
      incident-migrate:
        condition: service_completed_successfully

  postgres-test:
    profiles: ["test"]
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: aiops_test
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD before starting the local demo}
    networks:
      test-isolated:
        aliases:
          - postgres
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops -d aiops_test"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aiops-redis-data:/data
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG && redis-cli --raw INFO persistence | grep -q '^aof_last_write_status:ok'"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-demo@example.test}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Export ZO_ROOT_USER_PASSWORD before starting the local demo}
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - incident-holmes
      - telemetry-write
    depends_on:
      openobserve:
        condition: service_started

  holmes-api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    entrypoint: ["python", "-u", "server.py"]
    environment:
      HOME: /tmp
      HOLMES_CONFIGPATH_DIR: /tmp
      HOLMES_HOST: 0.0.0.0
      HOLMES_PORT: "5050"
      HOLMES_API_KEY: ${HOLMES_API_KEY:?Export HOLMES_API_KEY before starting the local demo}
      MODEL: ${HOLMES_MODEL:-deepseek/deepseek-flash}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENOBSERVE_PROXY_USERNAME: ${OPENOBSERVE_PROXY_USERNAME:?Export local proxy username before starting the demo}
      OPENOBSERVE_PROXY_PASSWORD: ${OPENOBSERVE_PROXY_PASSWORD:?Export local proxy password before starting the demo}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: holmesgpt-aiops
    volumes:
      - ${HOLMES_CONFIG_FILE:-./holmes-config/config.yaml.example}:/tmp/config.yaml:ro
      - ./skills:/etc/holmes/skills:ro
    ports:
      - "127.0.0.1:5050:5050"
    networks:
      - holmes-observe
      - incident-holmes
      - model-egress
    depends_on:
      openobserve-proxy:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,urllib.request; sys.exit(0 if os.getenv('DEEPSEEK_API_KEY') and urllib.request.urlopen('http://127.0.0.1:5050/readyz', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  order-service:
    build: ./demo/order-service
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      OPENOBSERVE_URL: http://openobserve:5080
      OPENOBSERVE_ORG: default
      OPENOBSERVE_USER: ${ZO_ROOT_USER_EMAIL:-demo@example.test}
      OPENOBSERVE_PASSWORD: ${ZO_ROOT_USER_PASSWORD:?Export ZO_ROOT_USER_PASSWORD before starting the local demo}
      # Set CHAOS_MODE=on to simulate the bad release: POST /orders returns 500
      CHAOS_MODE: ${CHAOS_MODE:-off}
      # Optional local CI release webhook authentication. Never commit a real secret.
      RELEASE_WEBHOOK_SECRET: ${RELEASE_WEBHOOK_SECRET:-}
      ORDER_ACTION_TOKEN: ${ORDER_ACTION_TOKEN:?Export ORDER_ACTION_TOKEN before starting the local demo}
      ORDER_ACTION_STATE_PATH: /var/lib/order-service/test-action-state.json
      OTEL_SERVICE_NAME: order-service
      RELEASE_VERSION: ${RELEASE_VERSION:-v1.0.0}
    volumes:
      - order-action-data:/var/lib/order-service
    networks:
      - app
      - telemetry-write
    depends_on:
      openobserve:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  incident-migrate:
    build:
      context: ./alert-trigger
      target: runtime
    command: ["python", "migrate.py"]
    environment:
      AIOPS_ENV: local
      MIGRATION_DATABASE_ROLE: aiops_migrator
      MIGRATION_DATABASE_URL: postgresql://aiops_migrator:${AIOPS_DB_MIGRATOR_PASSWORD:?Export AIOPS_DB_MIGRATOR_PASSWORD before starting the local demo}@postgres:5432/aiops
    networks:
      - app
    depends_on:
      postgres:
        condition: service_healthy
      incident-db-bootstrap:
        condition: service_completed_successfully

  incident-api:
    build:
      context: ./alert-trigger
      target: runtime
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      AIOPS_ENV: local
      AIOPS_AUTH_MODE: local
      AIOPS_DEMO_ACTIONS_ENABLED: "true"
      AIOPS_METRICS_TOKEN: ${AIOPS_METRICS_TOKEN:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:?Export ALERT_WEBHOOK_TOKEN before starting the local demo}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:-}
      DATABASE_URL: postgresql://aiops_runtime:${AIOPS_DB_RUNTIME_PASSWORD:?Export AIOPS_DB_RUNTIME_PASSWORD before starting the local demo}@postgres:5432/aiops
      REDIS_URL: redis://redis:6379/0
      SESSION_SIGNING_KEY: ${SESSION_SIGNING_KEY:?Export SESSION_SIGNING_KEY before starting the local demo}
      AIOPS_TEST_USERS_JSON: ${AIOPS_TEST_USERS_JSON:?Export AIOPS_TEST_USERS_JSON with local test accounts before starting the local demo}
      ORDER_SERVICE_URL: http://order-service:8080
      ORDER_ACTION_SERVICE_TOKEN: ${ORDER_ACTION_TOKEN:?Export ORDER_ACTION_TOKEN before starting the local demo}
    networks:
      - app
      - incident-webhook
    depends_on:
      postgres:
        condition: service_healthy
      incident-migrate:
        condition: service_completed_successfully
      incident-db-finalize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/readyz', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Docker Desktop does not publish ports for services attached only to
  # internal networks. Keep the app containers isolated and publish localhost
  # ports from this fixed-target proxy instead.
  local-ingress:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    user: "101:101"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    volumes:
      - ./local-ingress.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${ORDER_SERVICE_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${AIOPS_API_HOST_PORT:-8081}:8081"
    networks:
      - default
      - app
      - incident-webhook
    depends_on:
      order-service:
        condition: service_healthy
      incident-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/readyz && wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3

  incident-worker:
    build:
      context: ./alert-trigger
      target: runtime
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    command: ["python", "worker_entrypoint.py", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      AIOPS_ENV: local
      WORKER_DATABASE_URL: postgresql://aiops_worker:${AIOPS_DB_WORKER_PASSWORD:?Export AIOPS_DB_WORKER_PASSWORD before starting the local demo}@postgres:5432/aiops
      REDIS_URL: redis://redis:6379/0
      HOLMES_API_URL: http://holmes-api:5050
      HOLMES_API_KEY: ${HOLMES_API_KEY:?Export HOLMES_API_KEY before starting the local demo}
      HOLMES_TIMEOUT_SECONDS: ${HOLMES_TIMEOUT_SECONDS:-900}
    networks:
      - app
      - incident-holmes
    depends_on:
      postgres:
        condition: service_healthy
      incident-migrate:
        condition: service_completed_successfully
      incident-db-finalize:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      holmes-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from worker import celery_app; import sys; sys.exit(0 if celery_app.control.ping(timeout=3) else 1)"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 10s

  incident-test:
    profiles: ["test"]
    build:
      context: ./alert-trigger
      target: test
    command: ["python", "-m", "pytest", "-q", "tests"]
    environment:
      AIOPS_TEST_DATABASE_URL: postgresql://aiops:${POSTGRES_PASSWORD:?Export POSTGRES_PASSWORD before starting the local demo}@postgres:5432/aiops_test
      PYTEST_ADDOPTS: -p no:cacheprovider
      TMPDIR: /tmp
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    networks:
      - test-isolated
    depends_on:
      postgres-test:
        condition: service_healthy

volumes:
  oo-data:
  aiops-postgres-data:
  aiops-redis-data:
  order-action-data:

networks:
  app:
    internal: true
  observe-ui:
  telemetry-write:
    internal: true
  observe-policy:
    internal: true
  holmes-observe:
    internal: true
  incident-holmes:
    internal: true
  incident-webhook:
    internal: true
  model-egress:
  test-isolated:
    internal: true
