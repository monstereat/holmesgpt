# Provider-neutral production configuration template. The deployment platform
# must mount certificates and secret files, protect receiver reachability, and
# choose queue/memory limits from measured traffic before use.
extensions:
  basicauth/openobserve:
    client_auth:
      username_file: ${env:OPENOBSERVE_WRITER_USERNAME_FILE}
      password_file: ${env:OPENOBSERVE_WRITER_PASSWORD_FILE}
  bearertokenauth/otlp:
    filename: ${env:OTEL_RECEIVER_TOKEN_FILE}
  file_storage/queue:
    directory: ${env:OTEL_QUEUE_STORAGE_DIR}
    timeout: 10s
    max_size: ${env:OTEL_QUEUE_FILE_MAX_BYTES}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 10485760
        read_timeout: 30s
        read_header_timeout: 10s
        write_timeout: 30s
        auth:
          authenticator: bearertokenauth/otlp
        tls:
          cert_file: ${env:OTEL_RECEIVER_CERT_FILE}
          key_file: ${env:OTEL_RECEIVER_KEY_FILE}

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_MEMORY_SPIKE_LIMIT_MIB}
  batch:
    timeout: 5s
    send_batch_size: ${env:OTEL_BATCH_SIZE}

exporters:
  otlp_http/openobserve:
    endpoint: https://${env:OPENOBSERVE_HOST}/api/${env:OPENOBSERVE_ORG}
    auth:
      authenticator: basicauth/openobserve
    headers:
      stream-name: ${env:OPENOBSERVE_OTLP_STREAM}
    timeout: 10s
    sending_queue:
      enabled: true
      queue_size: ${env:OTEL_EXPORT_QUEUE_SIZE}
      storage: file_storage/queue
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: ${env:OTEL_EXPORT_RETRY_MAX_ELAPSED_TIME}

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                without_type_suffix: true
                without_units: true
  extensions:
    - basicauth/openobserve
    - bearertokenauth/otlp
    - file_storage/queue
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/openobserve]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/openobserve]
