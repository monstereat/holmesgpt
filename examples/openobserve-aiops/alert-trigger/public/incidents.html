<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Holmes AIOps · 事故工作台</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182230; background: #f4f6f8; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; background: #14273e; color: white; }
      h1 { margin: 0; font-size: 18px; font-weight: 650; }
      main { width: min(1240px, 100%); margin: 28px auto; padding: 0 20px; }
      .card { background: white; border: 1px solid #e1e6ec; border-radius: 10px; padding: 20px; box-shadow: 0 3px 12px #1822300a; }
      .login { max-width: 420px; margin: 9vh auto; }
      label { display: block; margin: 14px 0 6px; font-size: 13px; color: #526174; }
      input, textarea { width: 100%; min-height: 42px; padding: 8px 11px; border: 1px solid #cbd4df; border-radius: 6px; font: inherit; }
      textarea { min-height: 78px; resize: vertical; }
      button, select { min-height: 36px; padding: 7px 12px; border: 1px solid #b8c5d3; border-radius: 6px; background: white; color: #173653; font: inherit; cursor: pointer; }
      button.primary { color: white; border-color: #1769aa; background: #1769aa; }
      button:disabled { opacity: .55; cursor: wait; }
      .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
      .toolbar h2, .detail h2 { margin: 0; font-size: 17px; }
      .toolbar-actions { display: flex; gap: 8px; }
      .layout { display: grid; grid-template-columns: minmax(320px, .9fr) minmax(400px, 1.1fr); gap: 16px; }
      table { width: 100%; border-collapse: collapse; }
      th, td { padding: 11px 8px; border-bottom: 1px solid #edf0f3; text-align: left; vertical-align: top; font-size: 13px; }
      th { color: #627184; font-weight: 600; }
      tr[data-id] { cursor: pointer; }
      tr[data-id]:hover { background: #f5f9fc; }
      .status { display: inline-block; padding: 3px 7px; border-radius: 99px; background: #edf2f7; color: #41556d; font-size: 12px; }
      .muted { color: #66778a; font-size: 13px; }
      .message { min-height: 20px; margin: 10px 0; color: #a33333; font-size: 13px; }
      .detail { min-height: 360px; }
      .detail section { margin-top: 20px; }
      .detail h3 { margin: 0 0 8px; font-size: 14px; }
      .detail pre { max-height: 280px; overflow: auto; margin: 7px 0; padding: 12px; border-radius: 6px; background: #f4f6f8; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 12px; }
      .task { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #edf0f3; font-size: 13px; }
      .hidden { display: none !important; }
      @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } header { padding: 15px 18px; } main { margin-top: 16px; padding: 0 12px; } }
    </style>
  </head>
  <body>
    <header><h1>Holmes AIOps · 事故工作台</h1><span id="identity" class="muted"></span></header>
    <main>
      <section id="login-panel" class="card login">
        <h2 id="local-login-title">登录本机测试环境</h2>
        <p id="local-login-description" class="muted">请使用由本地环境配置的测试账号。</p>
        <form id="login-form">
          <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required />
          <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required />
          <p id="login-message" class="message" role="alert"></p>
          <button class="primary" type="submit">登录</button>
        </form>
        <button id="oidc-login" class="primary hidden" type="button">使用组织账号登录</button>
      </section>
      <section id="workbench" class="hidden">
        <div class="toolbar">
          <div><h2>事故</h2><span class="muted">项目 · order-service</span></div>
          <div class="toolbar-actions">
            <select id="status-filter" aria-label="按状态筛选"><option value="">全部状态</option><option>open</option><option>investigating</option><option>awaiting_approval</option><option>resolved</option><option>closed</option></select>
            <button id="refresh">刷新</button><button id="logout">退出</button>
          </div>
        </div>
        <p id="page-message" class="message" role="status"></p>
        <div class="layout">
          <section class="card" aria-label="事故列表">
            <div id="list-state" class="muted">等待加载…</div>
            <table id="incident-table" class="hidden"><thead><tr><th>告警</th><th>状态</th><th>Trace</th></tr></thead><tbody id="incident-rows"></tbody></table>
          </section>
          <article id="incident-detail" class="card detail"><p class="muted">选择一条事故查看调查结果和时间线。</p></article>
        </div>
      </section>
    </main>
    <script src="/incidents.js" defer></script>
  </body>
</html>
